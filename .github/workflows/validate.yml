name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install protocol test dependencies
        run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pyserial-asyncio-fast==0.16
      - name: Check Python, JSON and protocol behaviour
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/nuvo_m3/manifest.json > /dev/null
          python -m json.tool custom_components/nuvo_m3/strings.json > /dev/null
          python -m json.tool custom_components/nuvo_m3/translations/en.json > /dev/null
          python -m pytest -q
  validate-hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  validate-hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
